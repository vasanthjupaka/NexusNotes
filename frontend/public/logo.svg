<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nexus-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="44" stroke="url(#nexus-grad)" stroke-width="4" fill="#090d16" />
  <!-- Hexagonal Nexus Nodes -->
  <circle cx="50" cy="24" r="6" fill="#818cf8" filter="url(#glow)" />
  <circle cx="72" cy="38" r="6" fill="#a78bfa" filter="url(#glow)" />
  <circle cx="72" cy="62" r="6" fill="#c084fc" filter="url(#glow)" />
  <circle cx="50" cy="76" r="6" fill="#f472b6" filter="url(#glow)" />
  <circle cx="28" cy="62" r="6" fill="#a78bfa" filter="url(#glow)" />
  <circle cx="28" cy="38" r="6" fill="#818cf8" filter="url(#glow)" />
  <circle cx="50" cy="50" r="9" fill="url(#nexus-grad)" filter="url(#glow)" />
  <!-- Connecting Edges -->
  <line x1="50" y1="24" x2="50" y2="50" stroke="#818cf8" stroke-width="2" stroke-opacity="0.7" />
  <line x1="72" y1="38" x2="50" y2="50" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.7" />
  <line x1="72" y1="62" x2="50" y2="50" stroke="#c084fc" stroke-width="2" stroke-opacity="0.7" />
  <line x1="50" y1="76" x2="50" y2="50" stroke="#f472b6" stroke-width="2" stroke-opacity="0.7" />
  <line x1="28" y1="62" x2="50" y2="50" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.7" />
  <line x1="28" y1="38" x2="50" y2="50" stroke="#818cf8" stroke-width="2" stroke-opacity="0.7" />
  <line x1="50" y1="24" x2="72" y2="38" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 2" />
  <line x1="72" y1="38" x2="72" y2="62" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 2" />
  <line x1="72" y1="62" x2="50" y2="76" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 2" />
  <line x1="50" y1="76" x2="28" y2="62" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 2" />
  <line x1="28" y1="62" x2="28" y2="38" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 2" />
  <line x1="28" y1="38" x2="50" y2="24" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 2" />
</svg>
