services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nexusnotes-prod-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - nexus-prod-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusnotes-prod-frontend
    restart: always
    networks:
      - nexus-prod-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusnotes-prod-backend
    restart: always
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexus-prod-network

  db:
    image: mysql:8.0
    container_name: nexusnotes-prod-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexusnotes}
      MYSQL_USER: ${MYSQL_USER:-nexusnotes}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-prod-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-prod-network

networks:
  nexus-prod-network:
    driver: bridge

volumes:
  mysql-prod-data:
